[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-caption-flow"
version = "0.1.0"
description = "A local long-form video subtitle workflow for professional post-production, using LLM-assisted proofreading and private knowledge bases, with FFmpeg-based media processing and DaVinci Resolve–centered final delivery."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "fastapi",
  "python-multipart",
  "pypdf",
  "requests",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["caption_core*"]
